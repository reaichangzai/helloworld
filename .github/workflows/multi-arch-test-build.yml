name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: mvebu-cortexa53
          - arch: arm_cortex-a9
            target: mvebu-cortexa9
          - arch: x86_64
            target: x86-64

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="${GITHUB_BASE_REF#refs/heads/}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "Building for $BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Determine changed packages
        run: |
          # only detect packages with changes
          PKG_ROOTS=$(find . -name Makefile | \
            grep -v ".*/src/Makefile" | \
            sed -e 's@./\(.*\)/Makefile@\1/@')
          
          echo "Found package roots: $PKG_ROOTS"
          
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/${BRANCH}"
          else
            # 检查是否有前一个提交 - 这是关键修复！
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF=""
            fi
          fi
          
          PACKAGES=""
          
          if [ -z "$BASE_REF" ]; then
            echo "首次提交，使用默认包"
            PACKAGES="luci-app-ssr-plus"
          else
            echo "Comparing $BASE_REF with HEAD"
            CHANGES=$(git diff --diff-filter=d --name-only $BASE_REF HEAD 2>/dev/null || echo "")

            for ROOT in $PKG_ROOTS; do
              for CHANGE in $CHANGES; do
                if [[ "$CHANGE" == "$ROOT"* ]]; then
                  PACKAGE_NAME=$(echo "$ROOT" | sed -e 's@\(.*\)/@\1@')
                  PACKAGES="$PACKAGES $PACKAGE_NAME"
                  break
                fi
              done
            done
            
            PACKAGES="${PACKAGES:-luci-app-ssr-plus}"
          fi
          
          PACKAGES=$(echo $PACKAGES | xargs)
          echo "Final packages to build: $PACKAGES"
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV

      - name: Build
        uses: immortalwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          V: s
          target: ${{ matrix.target }}
          packages: ${{ env.PACKAGES }}

      - name: Check build output
        run: |
          echo "=== Checking build output ==="
          if [ -d "bin/packages/${{ matrix.arch }}" ]; then
            echo "✓ Build output directory exists"
            find bin/packages/${{ matrix.arch }} -type f | head -20
          else
            echo "✗ ERROR: Build output directory not found"
            ls -la bin/ 2>/dev/null || echo "No bin directory"
            exit 1
          fi

      - name: Move created packages to project dir
        run: |
          echo "=== Moving IPK packages ==="
          if ls bin/packages/${{ matrix.arch }}/packages_ci/*.ipk 1> /dev/null 2>&1; then
            echo "✓ Found IPK files, copying..."
            cp bin/packages/${{ matrix.arch }}/packages_ci/*.ipk . || true
            ls -lh *.ipk 2>/dev/null
          else
            echo "⚠ WARNING: No IPK files found"
            find bin/packages -name "*.ipk" -type f 2>/dev/null | head -20 || echo "No IPK files found"
            
            if [ -d "logs" ]; then
              echo ""
              echo "=== Last 50 lines of build logs ==="
              find logs -name "*.log" -type f -exec tail -50 {} + 2>/dev/null || true
            fi
          fi

      - name: Collect metadata
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_ID=$(git rev-parse --short origin/$BRANCH)
            HEAD_ID=$(git rev-parse --short HEAD)
            PRNUMBER=${GITHUB_REF_NAME%/merge}
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BASE_ID=$(git rev-parse --short HEAD^)
            else
              BASE_ID="initial"
            fi
            HEAD_ID=$MERGE_ID
            PRNUMBER="push-$MERGE_ID"
          fi
          
          echo "MERGE_ID=$MERGE_ID" >> $GITHUB_ENV
          echo "BASE_ID=$BASE_ID" >> $GITHUB_ENV
          echo "HEAD_ID=$HEAD_ID" >> $GITHUB_ENV
          echo "PRNUMBER=$PRNUMBER" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${{ matrix.arch }}-$PRNUMBER" >> $GITHUB_ENV

      - name: Generate metadata
        run: |
          shopt -s nullglob
          IPKS=( *.ipk )
          
          cat << EOF > PKG-INFO
          Metadata-Version: 2.1
          Name: ${{ env.ARCHIVE_NAME }}
          Version: $BRANCH
          Author: $GITHUB_ACTOR
          Home-page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Download-URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Summary: $PACKAGES
          Platform: ${{ matrix.arch }}

          Packages for ImmortalWrt $BRANCH running on ${{ matrix.arch }}, built from $PRNUMBER
          at commit $HEAD_ID, against $BRANCH at commit $BASE_ID.

          Modified packages:
          EOF
          
          for p in $PACKAGES; do
            echo "  $p" >> PKG-INFO
          done

          echo >> PKG-INFO
          echo "Package count: ${#IPKS[@]}" >> PKG-INFO
          
          if [ ${#IPKS[@]} -gt 0 ]; then
            echo "Package size summary:" >> PKG-INFO
            for f in "${IPKS[@]}"; do
              du -sh "$f" >> PKG-INFO
            done
          else
            echo "⚠ WARNING: No IPK packages were generated" >> PKG-INFO
          fi

          cat PKG-INFO

      - name: Store packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            Packages
            Packages.*
            *.ipk
            PKG-INFO

      - name: Store logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARCHIVE_NAME }}-logs
          path: |
            logs/
            PKG-INFO
